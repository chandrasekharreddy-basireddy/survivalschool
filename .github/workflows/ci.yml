name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: survivalschool
          POSTGRES_PASSWORD: survivalschool
          POSTGRES_DB: survivalschool_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U survivalschool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit
      - name: Lint (ruff)
        run: >-
          ruff check app tests
          --ignore I001,UP017,UP037,UP043,B904,C416,SIM103,SIM105,SIM117,W293
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Type check (mypy)
        # Non-blocking for now: the codebase is type-hinted but has never been
        # gated on a clean mypy run. This surfaces type errors in the log
        # without failing the build; drop continue-on-error once burned down.
        continue-on-error: true
        run: |
          pip install mypy
          mypy app
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://survivalschool:survivalschool@localhost:5432/survivalschool_test
          DATABASE_URL_SYNC: postgresql+psycopg2://survivalschool:survivalschool@localhost:5432/survivalschool_test
          JWT_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: alembic upgrade head
      - name: Check for model/migration drift
        # Fails if models changed without a matching migration. Non-blocking
        # initially: autogenerate does not perfectly detect CHECK constraints
        # and can report benign diffs.
        continue-on-error: true
        env:
          DATABASE_URL: postgresql+asyncpg://survivalschool:survivalschool@localhost:5432/survivalschool_test
          DATABASE_URL_SYNC: postgresql+psycopg2://survivalschool:survivalschool@localhost:5432/survivalschool_test
          JWT_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: alembic check
      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://survivalschool:survivalschool@localhost:5432/survivalschool_test
          DATABASE_URL_SYNC: postgresql+psycopg2://survivalschool:survivalschool@localhost:5432/survivalschool_test
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          EMAIL_BACKEND: console
          AI_PROVIDER: mock
        run: pytest --tb=short -q

  frontend-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Dependency audit (report-only)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-build]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --pull --tag survivalschool-backend:ci ./backend
      - name: Build frontend image
        run: docker build --pull --tag survivalschool-frontend:ci ./frontend
      # Install Trivy + Syft from their official scripts rather than Docker
      # actions — no action-resolution surprises, versions are explicit.
      - name: Install Trivy and Syft
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.56.2
          curl -sfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          trivy --version && syft version
      - name: Scan images for vulnerabilities (Trivy)
        # Reports OS + library CVEs (CRITICAL/HIGH, fixable only) for both
        # images. Report-only for now (exit-code 0) so unpatched upstream
        # base-image CVEs surface in the log without wedging the pipeline;
        # flip a severity to --exit-code 1 to gate once the base images are
        # under active patching control.
        run: |
          trivy image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 0 survivalschool-backend:ci
          trivy image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 0 survivalschool-frontend:ci
      - name: Generate SBOMs (Syft)
        run: |
          syft survivalschool-backend:ci -o spdx-json=sbom-backend.spdx.json
          syft survivalschool-frontend:ci -o spdx-json=sbom-frontend.spdx.json
          echo "SBOMs generated:" && ls -la sbom-*.spdx.json
