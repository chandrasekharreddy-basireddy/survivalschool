name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: survivalschool
          POSTGRES_PASSWORD: survivalschool
          POSTGRES_DB: survivalschool_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U survivalschool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit
      - name: Lint (ruff)
        run: >-
          ruff check app tests
          --ignore I001,UP017,UP037,UP043,B904,C416,SIM103,SIM105,SIM117,W293
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Type check (mypy)
        # Non-blocking for now: the codebase is type-hinted but has never been
        # gated on a clean mypy run. This surfaces type errors in the log
        # without failing the build; drop continue-on-error once burned down.
        continue-on-error: true
        run: |
          pip install mypy
          mypy app
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://survivalschool:survivalschool@localhost:5432/survivalschool_test
          DATABASE_URL_SYNC: postgresql+psycopg2://survivalschool:survivalschool@localhost:5432/survivalschool_test
          JWT_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: alembic upgrade head
      - name: Check for model/migration drift
        # Fails if models changed without a matching migration. Non-blocking
        # initially: autogenerate does not perfectly detect CHECK constraints
        # and can report benign diffs.
        continue-on-error: true
        env:
          DATABASE_URL: postgresql+asyncpg://survivalschool:survivalschool@localhost:5432/survivalschool_test
          DATABASE_URL_SYNC: postgresql+psycopg2://survivalschool:survivalschool@localhost:5432/survivalschool_test
          JWT_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: alembic check
      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://survivalschool:survivalschool@localhost:5432/survivalschool_test
          DATABASE_URL_SYNC: postgresql+psycopg2://survivalschool:survivalschool@localhost:5432/survivalschool_test
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          EMAIL_BACKEND: console
          AI_PROVIDER: mock
        run: pytest --tb=short -q

  frontend-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Dependency audit (report-only)
        # Actually non-blocking, matching its name: npm audit exits non-zero
        # whenever it finds a vulnerability at/above --audit-level, which
        # would otherwise fail the whole job on transitive advisories (e.g.
        # browserslist via @serwist/next) that this repo doesn't control and
        # that a fix would need to come from upstream.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-build]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --pull --tag survivalschool-backend:ci ./backend
      - name: Build frontend image
        run: docker build --pull --tag survivalschool-frontend:ci ./frontend
      # Supplementary image scanning (Trivy) + SBOM (Syft), installed from their
      # official scripts (no Docker-action resolution to trip over). Advisory:
      # the whole scan block is continue-on-error so a transient tooling/network
      # hiccup or an unpatched upstream base-image CVE never blocks the image
      # build, which is the real gate here. Findings are printed to the job log.
      - name: Scan images and generate SBOMs (advisory)
        continue-on-error: true
        run: |
          set -x
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version
          syft version
          trivy image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 0 survivalschool-backend:ci
          trivy image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 0 survivalschool-frontend:ci
          syft survivalschool-backend:ci -o spdx-json=sbom-backend.spdx.json
          syft survivalschool-frontend:ci -o spdx-json=sbom-frontend.spdx.json
          ls -la sbom-*.spdx.json
