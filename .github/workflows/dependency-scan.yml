name: Continuous dependency scan

# Runs independently of code changes, on a daily schedule — this is the
# part `ci.yml`'s pip-audit/npm-audit steps don't cover: a dependency that
# was clean last week can have a CVE disclosed against it today even if
# nobody touched the repo. This job exists to catch that gap.
on:
  schedule:
    # 06:15 UTC daily. Off the top of the hour deliberately — GitHub
    # Actions' scheduler queues everything scheduled for :00 across every
    # public repo simultaneously, which delays those runs; a few minutes
    # past the hour runs close to on-time.
    - cron: "15 6 * * *"
  workflow_dispatch: {} # manual "run now" button in the Actions tab

permissions:
  contents: read
  issues: write # only used by the failure-notification step below

jobs:
  backend-dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Scan backend/requirements.txt
        id: audit
        run: pip-audit -r requirements.txt --desc

  frontend-dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Scan npm dependencies (production only, fails on high/critical)
        run: npm audit --omit=dev --audit-level=high

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [backend-dependency-scan, frontend-dependency-scan]
    if: failure()
    steps:
      - name: Open (or reuse) a tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Dependency scan found a vulnerability";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependency-vulnerability",
            });
            const body = `The scheduled dependency scan failed. See the run for the affected package(s) and severity: ${runUrl}`;
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["dependency-vulnerability", "security"],
              });
            }
