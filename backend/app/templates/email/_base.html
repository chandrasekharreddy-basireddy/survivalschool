<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }}</title>
</head>
<body style="margin:0;padding:0;background-color:#0b0f19;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0b0f19;padding:32px 0;">
    <tr><td align="center">
      <table role="presentation" width="100%" style="max-width:560px;background-color:#12172a;border-radius:16px;overflow:hidden;">
        <tr><td style="background:linear-gradient(135deg,#5b5bff,#8b5cf6);padding:28px 32px;">
          <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:-0.02em;">{{ app_name }}</span>
        </td></tr>
        <tr><td style="padding:32px;color:#e5e7eb;font-size:15px;line-height:1.6;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:20px 32px;border-top:1px solid #1f2537;color:#6b7280;font-size:12px;">
          You received this email because you have an account on {{ app_name }}. If this wasn't you, you can safely ignore it or contact support.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
