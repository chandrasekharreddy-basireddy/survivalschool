{% extends "_base.html" %}
{% block content %}
<h1 style="color:#ffffff;font-size:22px;margin:0 0 12px;">Reset your password</h1>
<p>Hi {{ full_name }}, we received a request to reset your password.</p>
<p style="margin:28px 0;">
  <a href="{{ reset_url }}" style="background:#5b5bff;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;display:inline-block;">Reset password</a>
</p>
<p style="color:#9ca3af;font-size:13px;">This link expires in {{ ttl_minutes }} minutes. If you didn't request this, you can ignore this email — your password won't change.</p>
{% endblock %}
