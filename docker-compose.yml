name: survivalschool

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: survivalschool
      POSTGRES_PASSWORD: survivalschool
      POSTGRES_DB: survivalschool
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survivalschool -d survivalschool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://survivalschool:survivalschool@postgres:5432/survivalschool
      DATABASE_URL_SYNC: postgresql+psycopg2://survivalschool:survivalschool@postgres:5432/survivalschool
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://survivalschool:survivalschool@postgres:5432/survivalschool
      DATABASE_URL_SYNC: postgresql+psycopg2://survivalschool:survivalschool@postgres:5432/survivalschool
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    restart: "no"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://survivalschool:survivalschool@postgres:5432/survivalschool
      DATABASE_URL_SYNC: postgresql+psycopg2://survivalschool:survivalschool@postgres:5432/survivalschool
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
