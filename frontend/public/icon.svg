<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Survival School">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12141c"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="tri" x1="176" y1="150" x2="336" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5f74"/>
      <stop offset="1" stop-color="#d11a34"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="196" r="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e92c47" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e92c47" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- circle -->
  <circle cx="256" cy="250" r="150" stroke="#2dd4bf" stroke-width="15" opacity="0.9"/>

  <!-- triangle (hero) -->
  <path d="M256 138 L360 322 H152 Z" fill="url(#tri)"/>

  <!-- square (structure) -->
  <rect x="222" y="250" width="68" height="68" rx="8" fill="#f4f6fb"/>

  <rect x="1" y="1" width="510" height="510" rx="111" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
</svg>
