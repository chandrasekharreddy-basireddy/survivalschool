# For real production use, prefer a managed Postgres (RDS/Cloud SQL/Azure Database
# for PostgreSQL) over running stateful Postgres in-cluster. This StatefulSet is
# provided so the manifest set is self-contained and cluster-deployable as-is for
# staging/demo purposes, matching docker-compose's postgres service.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: survivalschool
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "survivalschool"
            - name: POSTGRES_DB
              value: "survivalschool"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: survivalschool-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # avoids "lost+found" non-empty-dir init failure
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "survivalschool"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "survivalschool"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: survivalschool
spec:
  clusterIP: None # headless, stable DNS for the StatefulSet
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
