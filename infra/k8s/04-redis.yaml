# For real production use, prefer a managed Redis (ElastiCache/Memorystore/Azure
# Cache) over running Redis in-cluster without persistence/HA. This Deployment
# mirrors docker-compose's redis service for a self-contained, cluster-deployable
# manifest set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: survivalschool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: survivalschool
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
